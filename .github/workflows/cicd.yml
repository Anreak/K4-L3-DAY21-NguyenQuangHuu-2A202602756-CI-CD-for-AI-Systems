name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          if [ -n "${{ secrets.STORAGE_CREDENTIALS }}" ]; then
            if echo '${{ secrets.STORAGE_CREDENTIALS }}' | grep -q '"type": *"service_account"'; then
              echo '${{ secrets.STORAGE_CREDENTIALS }}' > /tmp/sa-key.json
              echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV
              dvc remote modify --local labstore credentialpath /tmp/sa-key.json
            else
              echo "AZURE_STORAGE_CONNECTION_STRING=${{ secrets.STORAGE_CREDENTIALS }}" >> $GITHUB_ENV
              dvc remote modify --local labstore connection_string "${{ secrets.STORAGE_CREDENTIALS }}"
            fi
          fi
          echo "ARTIFACT_BUCKET=${{ secrets.ARTIFACT_BUCKET }}" >> $GITHUB_ENV

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv data/holdout.csv

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        run: |
          python - <<'PYEOF'
          import os
          bucket = os.environ.get("ARTIFACT_BUCKET", "")
          conn_str = os.environ.get("AZURE_STORAGE_CONNECTION_STRING")
          local_file = "models/model.joblib"
          remote_key = "artifacts/current/model.joblib"

          if conn_str:
              from azure.storage.blob import BlobServiceClient
              service = BlobServiceClient.from_connection_string(conn_str)
              blob = service.get_blob_client(container=bucket, blob=remote_key)
              with open(local_file, "rb") as f:
                  blob.upload_blob(f, overwrite=True)
              print(f"Uploaded {local_file} to Azure container {bucket}/{remote_key}")
          else:
              from google.cloud import storage
              client = storage.Client()
              b = client.bucket(bucket)
              blob = b.blob(remote_key)
              blob.upload_from_filename(local_file)
              print(f"Uploaded {local_file} to GCS gs://{bucket}/{remote_key}")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          import sys
          f1 = float("${{ needs.train.outputs.f1 }}")
          print(f"Quality Gate check: f1_score = {f1:.4f}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print("PASSED: f1_score dat nguong >= 0.65. Dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl -sf http://localhost:8080/healthz && echo "Health check passed." || exit 1
